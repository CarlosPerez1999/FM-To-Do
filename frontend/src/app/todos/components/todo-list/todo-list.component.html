<section class="flex flex-col items-center w-10/12 mx-auto -mt-8 rounded-lg bg-primary dark:bg-primary-dark">
    <ul class="max-h-[348px] w-full overflow-y-auto  overflow-x-hidden [&::-webkit-scrollbar]:w-2
    [&::-webkit-scrollbar-track]:
    [&::-webkit-scrollbar-track]:bg-transparent
    [&::-webkit-scrollbar-thumb]:rounded-full
    [&::-webkit-scrollbar-thumb]:bg-transparent ">
     @for (todo of todos(); track todo.id) {
      <todo-item (delete)="delete($event)" [todo]="todo" (toggle)="toggle($event)"></todo-item>
     }
    </ul>
  <footer class=" flex justify-between w-full p-5  text-sm text-slate-400 dark:text-slate-500">
    <p>{{todosLeft()?.length}} items left</p>
    <button class="hover:text-accent cursor-pointer">Clear Completed</button>
  </footer>
</section>
