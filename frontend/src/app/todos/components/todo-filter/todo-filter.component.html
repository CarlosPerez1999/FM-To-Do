<section
  class=" flex justify-center items-center gap-5 w-10/12 m-auto mt-5  p-4 sm:p-2 sm:w-6/12 sm:-mt-13 rounded-lg bg-primary sm:bg-transparent sm:dark:bg-transparent dark:bg-primary-dark font-bold text-slate-600 shadow-xl sm:shadow-none dark:shadow-black ">
  @for (filter of filters; track filter) {
  <button (click)="filterData(filter)" 
    [className]="selectedFilter() === filter ? 'text-accent cursor-pointer' : 'cursor-pointer'">{{filter}}</button>
  }
</section>
