<main class="min-h-dvh flex flex-col bg-secondary transition-colors duration-500 dark:bg-secondary-dark font-custom font-semibold " >
  <todo-hero></todo-hero>
  <div class="flex flex-col mx-auto w-full sm:w-full  lg:w-6/12">
    <todo-input (create)="create($event)" ></todo-input>
    <todo-list [todos]="filteredTodos()"></todo-list>
    <todo-filter  (filter)="changeFilter($event)" ></todo-filter>
  </div>
</main>
